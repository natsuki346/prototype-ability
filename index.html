<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2764d8" />
  <title>Ability — 状態の気づきプロトタイプ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="prototype-pill"><span class="status-dot"></span><span data-copy="sample">サンプル</span></div>
      <div class="language-switch" aria-label="Language"><button data-lang="ja">日本語</button><span>/</span><button data-lang="en">EN</button></div>
    </header>

    <main id="app" class="main-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-item is-active" data-screen="now"><span class="nav-icon">◉</span><span>Now</span></button>
      <button class="nav-item" data-screen="past"><span class="nav-icon">↺</span><span>Past</span></button>
      <button class="nav-item" data-screen="report"><span class="nav-icon">▥</span><span>Report</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
